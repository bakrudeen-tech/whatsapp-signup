
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qphotostudios - WhatsApp Business Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 24px;
      color: #222;
    }

    button {
      background: #1877f2;
      border: 0;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      padding: 12px 20px;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      line-height: 1.5;
    }

    #sessionInfo {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f4f4f4;
      padding: 12px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h2>Connect WhatsApp Business</h2>
  <p>
    Connect your WhatsApp Business app number using
    Meta Embedded Signup, if your account is eligible.
  </p>

  <button id="signupButton" type="button"
          onclick="launchWhatsAppSignup()">
    Connect WhatsApp
  </button>

  <p id="status" role="status">Loading Meta SDK...</p>
  <pre id="sessionInfo"></pre>

  <script>
    const APP_ID = "1090822260208465";
    const CONFIG_ID = "4373621359614568";

    const statusEl = document.getElementById("status");
    const sessionEl = document.getElementById("sessionInfo");
    const signupButton = document.getElementById("signupButton");

    window.fbAsyncInit = function () {
      FB.init({
        appId: APP_ID,
        autoLogAppEvents: true,
        xfbml: true,
        version: "v23.0"
      });

      statusEl.textContent =
        "Meta SDK loaded. Click Connect WhatsApp to start.";
    };

    // Load Facebook JavaScript SDK.
    (function (d, s, id) {
      if (d.getElementById(id)) return;

      const js = d.createElement(s);
      js.id = id;
      js.src = "https://connect.facebook.net/en_US/sdk.js";

      const firstScript = d.getElementsByTagName(s)[0];
      firstScript.parentNode.insertBefore(js, firstScript);
    })(document, "script", "facebook-jssdk");

    // Facebook Login callback.
    function fbLoginCallback(response) {
      if (response.authResponse &&
          response.authResponse.code) {
        statusEl.textContent =
          "Authorization code received. Server-side processing is required " +
          "before the integration can be completed.";

        // IMPORTANT:
        // Do not put your App Secret or access tokens in this page.
        // Send the authorization code to a secure backend when available.
        // No backend is currently configured in this example.
      } else {
        statusEl.textContent =
          "No authorization code received. The flow may have been cancelled " +
          "or blocked. Check the session event below.";
      }

      signupButton.disabled = false;
    }

    // Listen for Meta Embedded Signup session events.
    window.addEventListener("message", function (event) {
      // Only accept messages from Meta's expected origin.
      if (event.origin !== "https://www.facebook.com") {
        return;
      }

      let data;

      try {
        data = typeof event.data === "string"
          ? JSON.parse(event.data)
          : event.data;
      } catch (error) {
        return;
      }

      if (!data || data.type !== "WA_EMBEDDED_SIGNUP") {
        return;
      }

      // Display only non-secret session information for debugging.
      // Do not display or log authorization codes or access tokens.
      const eventName = data.event || "UNKNOWN";
      const sessionData = data.data || {};

      sessionEl.textContent = JSON.stringify({
        type: data.type,
        event: eventName,
        data: sessionData
      }, null, 2);

      if (eventName === "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING" ||
          eventName === "FINISH") {
        statusEl.textContent =
          "Meta reports that the signup flow finished. " +
          "Backend integration and verification may still be required.";
      } else if (eventName === "CANCEL") {
        statusEl.textContent =
          "Signup was cancelled. Review the session event details.";
      } else if (eventName === "ERROR") {
        statusEl.textContent =
          "Meta reported a signup error. Review the details below.";
      } else {
        statusEl.textContent =
          "Embedded Signup event received: " + eventName;
      }
    });

    // Launch must be called directly from the button click.
    function launchWhatsAppSignup() {
      if (!window.FB) {
        statusEl.textContent =
          "Meta SDK is not ready. Refresh the page and try again.";
        return;
      }

      signupButton.disabled = true;
      sessionEl.textContent = "";
      statusEl.textContent = "Opening Meta signup...";

      FB.login(fbLoginCallback, {
        config_id: CONFIG_ID,
        response_type: "code",
        override_default_response_type: true,
        extras: {
          setup: {},
          featureType: "whatsapp_business_app_onboarding",
          version: "v4"
        }
      });
    }
  </script>
</body>
</html>
