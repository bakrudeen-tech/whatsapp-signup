
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Business Signup</title>
</head>
<body>
  <h2>Connect WhatsApp Business</h2>
  <p>Connect your WhatsApp Business account using Meta Embedded Signup.</p>

  <button id="signupButton" onclick="launchWhatsAppSignup()">
    Connect WhatsApp
  </button>

  <p id="status">Loading Meta SDK...</p>
  <pre id="sessionInfo"></pre>

  <script>
    const APP_ID = "1090822260208465";
    const CONFIG_ID = "4373621359614568";

    const statusEl = document.getElementById("status");
    const sessionEl = document.getElementById("sessionInfo");

    window.fbAsyncInit = function () {
      FB.init({
        appId: APP_ID,
        autoLogAppEvents: true,
        xfbml: true,
        version: "v23.0"
      });

      statusEl.textContent =
        "Meta SDK loaded. Click Connect WhatsApp to continue.";
    };

    // Load Facebook JavaScript SDK.
    (function (d, s, id) {
      if (d.getElementById(id)) return;

      const js = d.createElement(s);
      js.id = id;
      js.src = "https://connect.facebook.net/en_US/sdk.js";

      const firstScript = d.getElementsByTagName(s)[0];
      firstScript.parentNode.insertBefore(js, firstScript);
    })(document, "script", "facebook-jssdk");

    // Receives the authorization response.
    function fbLoginCallback(response) {
      if (response.authResponse && response.authResponse.code) {
        statusEl.textContent =
          "Authorization code received. Backend processing is still required.";

        // Do not expose the authorization code or App Secret.
        // Send the code to a secure backend when one is configured.
      } else {
        statusEl.textContent =
          "No authorization code received. Signup may have been cancelled.";
      }
    }

    // Receive Embedded Signup session events.
    window.addEventListener("message", function (event) {
      if (event.origin !== "https://www.facebook.com") {
        return;
      }

      let data;

      try {
        data = typeof event.data === "string"
          ? JSON.parse(event.data)
          : event.data;
      } catch (error) {
        return;
      }

      if (!data || data.type !== "WA_EMBEDDED_SIGNUP") {
        return;
      }

      // Show event information for testing.
      // This does not complete the server-side integration.
      if (data.event === "FINISH") {
        statusEl.textContent =
          "Signup flow finished. Check the session details below.";

        sessionEl.textContent = JSON.stringify(
          data.data || {},
          null,
          2
        );
      } else if (data.event === "CANCEL") {
        statusEl.textContent =
          "Signup was cancelled. Review the session details.";

        sessionEl.textContent = JSON.stringify(
          data.data || {},
          null,
          2
        );
      } else if (data.event === "ERROR") {
        statusEl.textContent =
          "Meta reported an Embedded Signup error.";

        sessionEl.textContent = JSON.stringify(
          data.data || {},
          null,
          2
        );
      }
    });

    // Launch v4 Embedded Signup on button click.
    function launchWhatsAppSignup() {
      if (!window.FB) {
        statusEl.textContent =
          "Meta SDK is not ready. Refresh and try again.";
        return;
      }

      sessionEl.textContent = "";
      statusEl.textContent = "Opening Meta signup...";

      FB.login(fbLoginCallback, {
        config_id: CONFIG_ID,
        response_type: "code",
        override_default_response_type: true,
        extras: {
          version: "v4"
        }
      });
    }
  </script>
</body>
</html>
